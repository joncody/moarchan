[package]
name = "moarchan"
version = "0.1.0"
edition = "2024"
authors = ["Principal Rust Systems Architect"]

[dependencies]
# Web & HTTP/2 Engine
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
hyper = { version = "1.0", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "catch-panic", "cors"] }

# Asynchronous Runtime & Async Trait
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures-util = "0.3"

# Database & Migrations
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "json",
    "chrono",
    "uuid"
] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

# Image Processing (CPU-bound)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }

# Security, Cryptography, Hashing & Sanitization
bcrypt = "0.16"
aes-gcm = "0.10"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
html-escape = "0.2"
regex = "1.11"

# Templating
minijinja = { version = "2.7", features = ["loader", "json"] }

# Concurrency & In-Memory Data Structures
dashmap = "6.1"

# Error Handling & Tracing
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
