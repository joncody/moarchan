services:
  caddy:
    image: caddy:2-alpine
    container_name: moarchan-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # QUIC / HTTP/3 UDP listener
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: moarchan-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moarchan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moarchan}
      POSTGRES_DB: ${POSTGRES_DB:-moarchan}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: moarchan-app
    restart: always
    expose:
      - "9001"
    environment:
      PORT: "9001"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-moarchan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moarchan}
      POSTGRES_DB: ${POSTGRES_DB:-moarchan}
      SESSION_HASH_KEY: ${SESSION_HASH_KEY:-12345678901234567890123456789012}
      SESSION_BLOCK_KEY: ${SESSION_BLOCK_KEY:-abcdefghijklmnopqrstuvwx12345678}
    depends_on:
      - db

volumes:
  pgdata:
  caddy_data:
  caddy_config:
