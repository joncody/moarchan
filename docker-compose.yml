version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: moarchan-db
    environment:
      POSTGRES_USER: moarchan
      POSTGRES_PASSWORD: moarchan
      POSTGRES_DB: moarchan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
